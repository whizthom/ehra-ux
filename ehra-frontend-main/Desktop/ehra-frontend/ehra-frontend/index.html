<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Viewport: viewport-fit=cover lets the app draw under the
       notch/home-indicator on iOS so the standalone window fills the
       whole screen like a native app, instead of leaving black bars.
       Safe-area padding for that is handled in src/index.css. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Ehral</title>
  <meta name="description" content="Ehral — workforce, attendance and business management, in your pocket." />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f6e56" />
  <meta name="background-color" content="#f0f4f3" />

  <!-- Standalone/home-screen behavior on iOS (Android reads this from
       the manifest above instead). apple-mobile-web-app-title keeps the
       home-screen label short ("Ehral") instead of falling back to the
       page <title>. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ehral" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,650&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
