services:
  - type: web
    name: ehra-frontend
    runtime: static
    rootDir: Desktop/ehra-frontend/ehra-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # ── Cache-Control ────────────────────────────────────────────────────
    #
    # Without this, Render's default static-site caching applies to EVERY
    # file equally — including sw.js and index.html. That's what caused
    # deploys to not "take effect": the service worker's whole update
    # mechanism (src/pwa/UpdateToast.jsx) depends on the browser being able
    # to fetch a FRESH sw.js to diff against the installed one, and on a
    # fresh index.html to reference the new build's JS/CSS filenames. If
    # the CDN/browser is still serving an old cached copy of either one,
    # no amount of waiting (hours, days) ever surfaces the update — the
    # client genuinely never sees that anything changed.
    #
    # Deliberately listed as separate non-overlapping paths rather than a
    # broad `/*` rule layered with a more specific override — Render's own
    # docs/community reports (community.render.com/t/26918) show that when
    # two header rules for the same header name have overlapping paths,
    # which one wins is inconsistent/CDN-node-dependent. Every path below
    # is mutually exclusive with every other, so there's nothing to
    # arbitrate.
    #
    # Hashed files under /assets/ (Vite stamps a content hash into every
    # JS/CSS chunk's filename) are the one exception: their filename
    # itself changes whenever their content does, so caching them
    # "forever" is always safe and is what makes repeat visits fast.
    headers:
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /workbox-*.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable